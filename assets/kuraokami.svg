<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#262038"/><stop offset="1" stop-color="#0f0c1a"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.55" r="0.5">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.5"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="f1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e9ddff"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
    <linearGradient id="f2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#6d28d9"/></linearGradient>
    <linearGradient id="f3" x1="0" y1="0" x2="0.3" y2="1"><stop offset="0" stop-color="#7c3aed"/><stop offset="1" stop-color="#3b1585"/></linearGradient>
    <linearGradient id="f4" x1="0" y1="0" x2="0.2" y2="1"><stop offset="0" stop-color="#4c1d95"/><stop offset="1" stop-color="#1e0b4a"/></linearGradient>
    <linearGradient id="dragon" gradientUnits="userSpaceOnUse" x1="16" y1="8" x2="112" y2="116">
      <stop offset="0" stop-color="#f3eeff"/><stop offset="0.55" stop-color="#c4b5fd"/><stop offset="1" stop-color="#7dd3fc"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bg)"/>
  <circle cx="64" cy="70" r="50" fill="url(#halo)"/>

  <!-- the jewel (宝珠): faceted crystal -->
  <g transform="translate(64 72) scale(0.62) translate(-64 -64)">
    <polygon points="60,14 34,42 66,50" fill="url(#f1)"/>
    <polygon points="60,14 66,50 94,37" fill="url(#f2)"/>
    <polygon points="34,42 66,50 62,114 36,100" fill="url(#f3)"/>
    <polygon points="66,50 94,37 92,96 62,114" fill="url(#f4)"/>
    <polygon points="34,42 36,100 28,78" fill="#5b21b6"/>
    <g fill="none" stroke="#f5f0ff" stroke-linecap="round">
      <path d="M60 14 L66 50 L62 114" stroke-width="1.4" opacity="0.5"/>
      <path d="M34 42 L66 50 L94 37" stroke-width="1.2" opacity="0.45"/>
    </g>
    <g filter="url(#glow)" stroke-linecap="round" stroke-linejoin="round" fill="none" stroke="#c4f1ff" stroke-width="6.5">
      <path d="M44 68 L57 78 L44 88"/>
      <path d="M63 92 L80 89"/>
    </g>
  </g>

  <!-- dragon (龍神) coiling around the jewel -->
  <g filter="url(#glow)" fill="none" stroke="url(#dragon)" stroke-linecap="round" stroke-linejoin="round">
    <!-- tail tapers in small steps so joints don't show -->
    <path d="M33 86 C 28 88, 25 92, 25 97" stroke-width="1.6"/>
    <path d="M25 97 C 25 101, 28 105, 33 107" stroke-width="2.4"/>
    <path d="M33 107 C 40 111, 48 113, 57 114" stroke-width="3.2"/>
    <path d="M57 114 C 64 114, 71 113, 78 111" stroke-width="4"/>
    <path d="M78 111 C 86 109, 93 105, 98 99" stroke-width="4.6"/>
    <!-- body: up the right side and over the top -->
    <path d="M98 99 C 106 89, 109 77, 107 64 C 105 48, 96 30, 78 23 C 68 19, 58 20, 50 26" stroke-width="5.2"/>
    <!-- whisker (龍の髭) -->
    <path d="M23 37 C 14 41, 11 50, 14 58 C 16 63, 21 64, 24 61" stroke-width="1.5"/>
    <!-- horns -->
    <path d="M46 22 C 48 13, 55 8, 64 7" stroke-width="2.2"/>
    <path d="M42 24 C 41 17, 44 12, 49 10" stroke-width="1.5"/>
  </g>
  <!-- dorsal fins -->
  <g fill="url(#dragon)" filter="url(#glow)">
    <polygon points="108,71 108,79 116,73"/>
    <polygon points="107,55 108,63 116,55"/>
    <polygon points="101,40 104,47 110,37"/>
    <polygon points="89,27 94,31 95,19"/>
    <polygon points="75,21 81,22 78,12"/>
    <polygon points="60,20 66,20 61,12"/>
  </g>
  <!-- head: brow, snout and open jaw facing the jewel -->
  <path d="M52 27 L 46 21 L 38 25 L 25 31 L 19 37 L 29 38 L 35 37 L 25 44 L 37 44 L 47 36 Z" fill="url(#dragon)" filter="url(#glow)"/>
  <circle cx="40" cy="30" r="1.8" fill="#1a1230"/>
  <!-- claw grasping the jewel -->
  <g fill="none" stroke="url(#dragon)" stroke-linecap="round" filter="url(#glow)">
    <path d="M99 98 C 95 95, 91 94, 87 95" stroke-width="3"/>
    <path d="M87 95 C 84 93, 82 90, 82 87" stroke-width="1.6"/>
    <path d="M87 95 C 83 96, 80 96, 78 94" stroke-width="1.6"/>
    <path d="M87 95 C 85 98, 83 100, 80 101" stroke-width="1.6"/>
  </g>
</svg>
